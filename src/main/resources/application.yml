spring:
  application:
    name: backend-portfolio
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:defaultdb}?ssl=${DB_SSL_MODE:false}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jooq:
    sql-dialect: POSTGRES
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:backend-portfolio}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
server:
  port: 8080

groq:
  base-url: ${GROQ_BASE_URL:https://api.groq.com}
  api-keys: ${GROQ_API_KEYS:sample-api-key-1,sample-api-key-2}

leetcode:
  base-url: ${LEETCODE_BASE_URL:https://leetcode.com}

codeforces:
  base-url: ${CODEFORCES_BASE_URL:https://codeforces.com}

github:
  base-url: ${GITHUB_BASE_URL:https://api.github.com}

profile:
  profile-json-retreival-url: ${PROFILE_JSON_RETREIVAL_URL:https://zaiwjonzbotyjmoghqzh.supabase.co/storage/v1/object/public/portfolio/profile.json}
  personality-json-retreival-url: ${PERSONALITY_JSON_RETREIVAL_URL:https://zaiwjonzbotyjmoghqzh.supabase.co/storage/v1/object/public/portfolio/personality.json}

valkey:
  host: ${VALKEY_HOST:localhost}
  port: ${VALKEY_PORT:6379}
  username: ${VALKEY_USERNAME:}
  password: ${VALKEY_PASSWORD:}

loki:
  url: ${LOKI_URL:http://localhost:3100}
  username: ${LOKI_USERNAME:}
  password: ${LOKI_PASSWORD:}

details:
  leetcode-user-names: ${DETAILS_LEETCODE_USERNAMES:imsahibnanda}
  codeforces-user-names: ${DETAILS_CODEFORCES_USERNAMES:shisukenohara}
  github-user-names: ${DETAILS_GITHUB_USERNAMES:thesahibnanda-max,thesahibnanda}

llm:
  model-weights:
    LLAMA_3_3_70B: 50
    GPT_OSS_20B: 20
    QWEN_3_6_27B: 20
    GPT_OSS_120B: 10
  min-temperature: 0.8
  max-temperature: 1.4
  min-top-p: 0.9
  max-top-p: 1.0
  max-completion-tokens: 2048

auth:
  secret-key: ${AUTH_SECRET_KEY:local-dev-only-change-me}

chat-observer:
  kafka-topics:
    chat_repo_event:
      partitions: 3
      replication-factor: 1

user-observer:
  kafka-topics:
    user_repo_event:
      partitions: 3
      replication-factor: 1

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  https: ${OPENSEARCH_HTTPS:false}

search-service:
  chat-index-name: chat_index_document
  chat-number-of-shards: 2
  chat-number-of-replicas: 1