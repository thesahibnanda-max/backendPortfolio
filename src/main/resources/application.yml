spring:
  application:
    name: backend-portfolio
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:defaultdb}?ssl=${DB_SSL_MODE:false}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jooq:
    sql-dialect: POSTGRES
server:
  port: 8080

groq:
  base-url: ${GROQ_BASE_URL:https://api.groq.com}
  api-keys: ${GROQ_API_KEYS:sample-api-key-1,sample-api-key-2}

leetcode:
  base-url: ${LEETCODE_BASE_URL:https://leetcode.com}

codeforces:
  base-url: ${CODEFORCES_BASE_URL:https://codeforces.com}

github:
  base-url: ${GITHUB_BASE_URL:https://api.github.com}

profile:
  profile-json-retreival-url: ${PROFILE_JSON_RETREIVAL_URL:https://zaiwjonzbotyjmoghqzh.supabase.co/storage/v1/object/public/portfolio/profile.json}
